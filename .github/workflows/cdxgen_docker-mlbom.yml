name: ML-BOM from a Hugging Face purl or URL with cdxgen (Docker Image)

on:
  workflow_dispatch:
    inputs:
      src_repository:
        description: 'Hugging Face purl or URL'
        required: true
        default: ''

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Generate ML-BOM using cdxgen container
        run: |
          docker run --rm \
            -v .:/app:rw \
            -v /tmp:/tmp \
            -t ghcr.io/cyclonedx/cdxgen:latest \
            --include-formulation --bom-audit --bom-audit-categories \
            ai-bom ${{ inputs.src_repository }} --json-pretty
          
      - name: list files
        run: ls -la
        
      - name: artifact name
        id: artifactname
        run: |
          out_name="${{ inputs.src_repository }}"
          out_name="${out_name//\//-}"  # Replace '/' with '-'
          out_name="${out_name//./-}"  # Replace '.' with '-'
          out_name="${out_name//:/-}"  # Replace ':' with '-'
          echo "out_name=$out_name" >> $GITHUB_OUTPUT
  
      - name: Upload ML-BOM results
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifactname.outputs.out_name }}
          path: /tmp/*.json
          if-no-files-found: warn
