name: Container Image SBOM using Trivy

on:
  workflow_dispatch:
    inputs:
      image_repository:
        description: 'Container Image Repository'
        required: true
        default: ''
      src_vuln_type:
        description: List of package types (allowed values: os,library). Default os,library.
        required: false
        type: choice
        options:
          - 'os'
          - 'library'
          - 'os,library'
        default: 'os,library'
      scanners_type:
        description: List of what security issues to detect (license,vuln). Default license.
        required: false
        type: choice
        options:
          - 'license'
          - 'vuln'
          - 'vuln,license'
        default: 'license'
env:
  OUTPUT_NAME: 'cyclonedxSBOM'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    
    steps:

      - name: Generate SBOM using Trivy
        run: |
          docker run --rm \
            -v /tmp:/tmp \
            -t aquasec/trivy:0.75.0 image \
            --format "cyclonedx" \
            --scanners ${{ inputs.scanners_type }} \
            --pkg-types ${{ inputs.src_vuln_type }} \
            --output "/tmp/trivy-sbom.json" \
             ${{ inputs.image_repository }}
          
      - name: artifact name
        id: artifactname
        run: |
          out_name="${{ inputs.image_repository }}"
          out_name="${out_name//\//-}"  # Replace '/' with '-'
          echo "out_name=$out_name" >> $GITHUB_OUTPUT
  
      - name: Upload SBOM results
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifactname.outputs.out_name }}
          path: /tmp/*.json
          if-no-files-found: warn
